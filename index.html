<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For you</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{--plum:#123524;--rose:#d9b36c;--blush:#0f2a1d;--petal:#d9b36c;--sage:#8fae9b;--ink:#14301f;--cream:#f3ead2}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:'Cormorant Garamond',Georgia,serif;background-color:#0f2a1d;background-image:radial-gradient(ellipse at 50% 0%,#1d5036 0%,#0f2a1d 48%,#08170e 100%);background-attachment:fixed;color:var(--cream);font-size:20px;line-height:1.6}
.hidden{display:none!important}

/* ---------- LOCK SCREEN ---------- */
#lock{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 30%,#17452f,#0b1d14 45%,#050806 100%);color:#e9c97f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity 1s}
#lockFx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#lock>*:not(canvas){position:relative;z-index:1}
#lock .heart{width:62px;height:56px;filter:drop-shadow(0 0 14px rgba(255,60,80,.55)) drop-shadow(0 6px 8px rgba(0,0,0,.5));animation:beat 1.6s infinite}
#lock .heart svg{width:100%;height:100%;display:block}
@keyframes beat{50%{transform:scale(1.12)}}
#lock h1{font-size:30px;font-weight:600;font-style:italic;text-align:center;padding:0 20px;background:linear-gradient(90deg,#c9983f,#fff0b8,#c9983f);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:gshine 4s linear infinite}
@keyframes gshine{to{background-position:-200% 0}}
.dots{display:flex;gap:16px;height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #d9b36c;transition:.2s}
.dots i.on{background:#d9b36c;box-shadow:0 0 10px #ffd98a}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:20px 18px;margin-top:6px}
.pad button{position:relative;overflow:hidden;height:78px;border-radius:50%;border:1px solid rgba(233,201,127,.55);background:radial-gradient(circle at 50% 25%,#1f5a3c,#0e2a1c 75%);color:#f0d58f;font:600 32px 'Cormorant Garamond',serif;cursor:pointer;box-shadow:0 6px 0 #040b07,0 10px 18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,230,160,.4),0 0 14px rgba(217,179,108,.18);transition:transform .08s,box-shadow .08s}
.pad button::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,235,170,.38) 50%,transparent 65%);transform:translateX(-130%);animation:shine 4.5s ease-in-out infinite}
.pad button:nth-child(3n+1)::after{animation-delay:.4s}
.pad button:nth-child(3n+2)::after{animation-delay:1.3s}
.pad button:nth-child(3n)::after{animation-delay:2.2s}
@keyframes shine{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.pad button:active{transform:translateY(5px);box-shadow:0 1px 0 #040b07,0 3px 8px rgba(0,0,0,.6),inset 0 2px 6px rgba(0,0,0,.4),0 0 20px rgba(255,214,120,.5)}
.pad .blank{visibility:hidden}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#hint{font-size:17px;color:#9fb5a5;min-height:22px}

/* ---------- CAKE ---------- */
#cake{position:fixed;inset:0;z-index:55;--g:1;background:radial-gradient(circle at 50% 52%,rgba(255,170,80,calc(var(--g)*.3)),rgba(255,170,80,0) 60%),#060908;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;opacity:0;transition:opacity 1.2s;color:#f3ead2;text-align:center;padding:20px}
#cake.show{opacity:1}
#cText{font-size:clamp(34px,8vw,54px);font-weight:500;font-style:italic;text-shadow:0 2px 20px #000;transition:opacity .8s}
#cHint{font-size:18px;opacity:.75;min-height:26px;transition:opacity .8s}
#cSvg{width:min(420px,92vw);height:auto;overflow:visible}
.cn{cursor:pointer}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite;transition:opacity .25s}
.bend{transform-box:fill-box;transform-origin:50% 100%;transition:transform .08s}
.glow{animation:glw 1.1s ease-in-out infinite alternate;transition:opacity .3s}
.cn.out .flame,.cn.out .glow{opacity:0}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-1.5deg)}25%{transform:scale(.94,1.07) rotate(1.8deg)}50%{transform:scale(1.05,.95) rotate(-.6deg)}75%{transform:scale(.97,1.04) rotate(1deg)}}
@keyframes glw{from{opacity:.75}to{opacity:1}}
.smk{transform-box:fill-box;transform-origin:center;animation:smoke 2.2s ease-out forwards;opacity:0}
@keyframes smoke{0%{opacity:.7;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(10px,-54px) scale(2.4)}}

/* ---------- GARDEN ---------- */
#garden{position:fixed;inset:0;z-index:60;background:#060908;transition:opacity 1.4s}
#gc{position:absolute;inset:0;width:100%;height:100%}
#gText{position:absolute;left:0;right:0;top:30%;text-align:center;color:#fbe9d7;padding:0 24px;opacity:0;transition:opacity 2.6s;text-shadow:0 2px 24px #000,0 0 44px #000;pointer-events:none}
#gText h1{font-size:clamp(40px,9vw,78px);font-weight:500;line-height:1.1}
#gText p{font-size:clamp(18px,3.6vw,25px);font-style:italic;margin-top:12px;opacity:.88}
#garden.titled #gText{opacity:1}
#gBtn{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity 1.6s;border:1px solid rgba(251,233,215,.65);background:rgba(6,9,8,.6);color:#fbe9d7;padding:12px 32px;border-radius:40px;font:500 21px 'Cormorant Garamond',serif;cursor:pointer}
#garden.ready #gBtn{opacity:1;pointer-events:auto}

/* ---------- MAIN ---------- */
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:60px 30px 130px}
#vines{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.title{text-align:center;font-size:clamp(40px,10vw,64px);font-weight:700;color:var(--cream);line-height:1.1;margin-bottom:34px}
.title small{display:block;font-size:22px;font-style:italic;font-weight:500;color:var(--rose);margin-top:8px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:40px}
.hero img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:120px 120px 14px 14px}
.hero img:nth-child(2){margin-top:30px;border-radius:14px 14px 120px 120px}
.letter{background:#fffdf6;color:var(--ink);padding:34px 28px;border-radius:6px;box-shadow:0 14px 40px rgba(18,53,36,.14);font-style:italic;font-weight:500;font-size:25px;line-height:1.6;white-space:pre-wrap;min-height:200px;border-left:6px solid var(--petal)}
.cursor::after{content:'|';animation:blink .8s infinite}
@keyframes blink{50%{opacity:0}}
h2{scroll-margin-top:24px;font-size:34px;color:var(--rose);margin:64px 0 18px;text-align:center}
.mem{position:relative;margin-bottom:66px}
.mem img{width:78%;border-radius:14px;display:block}
.mem.r img,.mem.r video{margin-left:auto}
.note{position:absolute;top:44%;width:44%;z-index:2;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45));opacity:0;transition:opacity .9s .3s,transform .9s .3s}
.mem.l .note{right:0;transform:translateX(26px) rotate(10deg)}
.mem.r .note{left:0;transform:translateX(-26px) rotate(-10deg)}
.mem.in.l .note{opacity:1;transform:rotate(4deg)}
.mem.in.r .note{opacity:1;transform:rotate(-4deg)}
.paper{position:relative;padding:22px 14px 18px;color:var(--ink);font:italic 600 18px/24px 'Cormorant Garamond',serif;background:repeating-linear-gradient(#fffdf2 0 23px,rgba(90,130,110,.3) 23px 24px),#fffdf2;clip-path:polygon(0 0,100% 0,100% 94%,94% 100%,84% 95%,72% 100%,60% 95%,48% 100%,36% 95%,24% 100%,12% 95%,0 100%)}
.paper::before{content:"";position:absolute;top:6px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff0b8,#c9983f 55%,#8f6f2f);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.mem p{margin-top:12px;font-style:italic;font-size:22px;text-align:center}
.mem:nth-child(even) img{transform:rotate(1.2deg)}
.mem:nth-child(odd) img{transform:rotate(-1.2deg)}
iframe{width:100%;border:0;border-radius:14px;margin-bottom:12px}
#songs{display:flex;gap:14px}
#songs iframe{flex:1 1 0;min-width:0;margin-bottom:0}
.mem video{width:78%;border-radius:14px;display:block;background:#000}
.photo video{width:100%;height:100%;object-fit:cover;display:block;background:#000}

/* ---------- COUNTER + REASONS ---------- */
#counter{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cbox{background:linear-gradient(#17452f,#0e2a1c);border:1px solid rgba(217,179,108,.55);border-radius:14px;padding:14px 4px 12px;text-align:center;box-shadow:0 6px 0 #061a10,inset 0 1px 0 rgba(255,230,160,.3)}
.cbox b{display:block;font-size:clamp(26px,7vw,40px);color:#f0d58f;font-weight:700;line-height:1.1}
.cbox span{font-size:15px;font-style:italic;opacity:.8}
#cntSub{text-align:center;font-style:italic;font-size:22px;margin-top:18px;opacity:.9}
#reasons{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rc{perspective:900px;aspect-ratio:4/5;cursor:pointer}
.ri{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.rc.flip .ri{transform:rotateY(180deg)}
.rf,.rb{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center}
.rf{background:radial-gradient(circle at 50% 20%,#1f5a3c,#0e2a1c);border:1px solid rgba(217,179,108,.6);box-shadow:inset 0 0 0 6px #0e2a1c,inset 0 0 0 7px rgba(217,179,108,.5),0 8px 18px rgba(0,0,0,.4)}
.rf svg{width:24px;margin-bottom:8px}
.rf b{font-size:52px;color:#f0d58f;font-weight:700;line-height:1}
.rf span{font-size:15px;font-style:italic;opacity:.7;margin-top:6px}
.rb{background:#fffdf2;color:var(--ink);transform:rotateY(180deg);border:1px solid #d9b36c;box-shadow:0 8px 18px rgba(0,0,0,.4)}
.rb p{font-size:clamp(17px,4.4vw,21px);font-style:italic;font-weight:600;line-height:1.3;max-height:100%;overflow:auto}

/* ---------- MENU ---------- */
#letter{scroll-margin-top:24px}
#menu{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;max-width:94vw;display:flex;gap:4px;padding:6px;overflow-x:auto;background:rgba(8,23,14,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(217,179,108,.55);border-radius:40px;box-shadow:0 10px 26px rgba(0,0,0,.5);scrollbar-width:none}
#menu::-webkit-scrollbar{display:none}
#menu a{flex:none;padding:8px 14px;border-radius:30px;color:#e9c97f;font:italic 600 17px 'Cormorant Garamond',serif;text-decoration:none;white-space:nowrap;transition:background .25s,color .25s}
#menu a.on{background:#d9b36c;color:#0f2a1d}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:90;pointer-events:none}

/* ---------- ENVELOPES ---------- */
#envs{display:flex;flex-wrap:wrap;justify-content:center;gap:28px 16px;margin:64px 0;scroll-margin-top:26vh}
.ev{position:relative;width:min(300px,80vw);aspect-ratio:4/3;cursor:pointer;perspective:600px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45));transition:transform .25s}
.ev:not(.done){animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.ev .body{position:absolute;inset:0;background:#f2e6c8;border-radius:6px;overflow:hidden}
.ev .body i{position:absolute;inset:0;background:#e6d5ad}
.ev .body .l{clip-path:polygon(0 0,52% 56%,0 100%)}
.ev .body .r{clip-path:polygon(100% 0,48% 56%,100% 100%)}
.ev .body .b{background:#f7edd2;clip-path:polygon(0 100%,50% 50%,100% 100%)}
.ev .flap{position:absolute;left:0;right:0;top:0;height:58%;background:linear-gradient(#f9f0dc,#e3d1a6);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s cubic-bezier(.4,0,.2,1);z-index:3}
.ev.done .flap{transform:rotateX(180deg)}
.ev .seal{position:absolute;left:50%;top:58%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff6b7a,#c4122b 60%,#7a0b1a);z-index:4;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.4);transition:opacity .4s}
.ev .seal svg{width:20px}
.ev.done .seal{opacity:0}
.ev .lab{position:absolute;left:6px;right:6px;bottom:7%;text-align:center;z-index:2;color:#4a3414;font:italic 600 15px/1.05 'Cormorant Garamond',serif}
#envModal{position:fixed;inset:0;z-index:80;background:rgba(3,10,6,.8);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px}
.lp{position:relative;width:min(420px,92vw);max-height:82vh;overflow:auto;background:repeating-linear-gradient(#fffdf2 0 31px,rgba(90,130,110,.28) 31px 32px),#fffdf2;color:var(--ink);padding:36px 26px 26px;border-radius:6px;box-shadow:0 20px 50px rgba(0,0,0,.6);animation:rise .7s cubic-bezier(.2,1.2,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(60px) scale(.85) rotate(-3deg)}}
.lp h3{font-size:26px;font-style:italic;text-align:center;color:#123524;margin-bottom:14px}
.lp p{font:italic 600 21px/32px 'Cormorant Garamond',serif;white-space:pre-wrap}
.lp button{display:block;margin:18px auto 0;border:0;background:#d9b36c;color:#0f2a1d;font:600 19px 'Cormorant Garamond',serif;padding:9px 28px;border-radius:30px;cursor:pointer;box-shadow:0 4px 0 #8f6f2f}

/* ---------- QUIZ ---------- */
.qz{margin-top:30px;background:linear-gradient(#17452f,#0e2a1c);border:1px solid rgba(217,179,108,.55);border-radius:18px;padding:22px 18px 18px;box-shadow:0 8px 0 #061a10,0 16px 30px rgba(0,0,0,.4)}
.qdots{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.qdots i{width:10px;height:10px;border-radius:50%;border:1.5px solid #d9b36c}
.qdots i.on{background:#d9b36c}
.qdots i.cur{box-shadow:0 0 8px #ffd98a}
.qn{text-align:center;font-style:italic;opacity:.75;font-size:17px}
.qq{text-align:center;font-size:25px;font-style:italic;font-weight:600;color:#f3ead2;margin:10px 0 16px;line-height:1.25}
.qo{display:grid;gap:12px}
.qo button,.qa{border:1px solid rgba(233,201,127,.55);border-radius:30px;padding:13px 16px;background:radial-gradient(circle at 50% 20%,#1f5a3c,#0e2a1c 80%);color:#f0d58f;font:600 20px 'Cormorant Garamond',serif;cursor:pointer;box-shadow:0 5px 0 #040b07,inset 0 1px 0 rgba(255,230,160,.35);transition:transform .08s,box-shadow .08s,background .25s}
.qo button:active:not(:disabled),.qa:active{transform:translateY(4px);box-shadow:0 1px 0 #040b07}
.qo button.ok{background:linear-gradient(#3ea56b,#2a7a4c);color:#fff;border-color:#b6f0c9;box-shadow:0 5px 0 #145031,0 0 18px rgba(80,220,140,.6)}
.qo button.no{background:linear-gradient(#7a1b2c,#4e0f1b);color:#ffc9d0;border-color:#ff8a9a;box-shadow:0 5px 0 #2a0710;animation:shake .4s;opacity:.85}
.qo button:disabled{cursor:default}
.qm{text-align:center;font-style:italic;font-size:20px;min-height:28px;margin-top:14px;color:#f0d58f}
.qres{text-align:center}
.qbig{font-size:64px;font-weight:700;color:#f0d58f;line-height:1}
.qa{margin-top:6px;padding:11px 30px}

/* ---------- GIFT ---------- */
#gift{text-align:center}
.gsvg{width:min(260px,70vw);display:block;margin:0 auto;cursor:pointer;overflow:visible}
#gift:not(.open) .gsvg{animation:wob 3s ease-in-out infinite}
@keyframes wob{0%,40%,100%{transform:rotate(0)}8%{transform:rotate(-3deg)}16%{transform:rotate(3deg)}24%{transform:rotate(-2deg)}32%{transform:rotate(1deg)}}
.gsvg .lid,.gsvg .bow{transform-box:fill-box;transform-origin:center}
.gsvg .lid{transition:transform 1s .5s cubic-bezier(.4,1.5,.5,1),opacity .8s 1s}
#gift.open .lid{transform:translate(40px,-120px) rotate(18deg);opacity:0}
#gift.open .bow{animation:untie .7s forwards}
@keyframes untie{40%{transform:scale(1.15) rotate(8deg)}100%{transform:scale(0) rotate(90deg)}}
.gsvg .gl{opacity:0;transition:opacity 1s .6s}
#gift.open .gl{opacity:1}
#giftHint{font-style:italic;font-size:21px;margin-top:12px;opacity:.85;transition:opacity .5s}
#giftCard{max-height:0;opacity:0;overflow:hidden;padding:0 22px;margin-top:0;background:#fffdf2;color:var(--ink);border-radius:8px;border:1px solid #d9b36c;transition:max-height 1.4s 1s,opacity 1s 1s,margin 1s 1s,padding 1s 1s}
#gift.open #giftCard{max-height:900px;opacity:1;margin-top:26px;padding:26px 22px}
#giftMsg{font-size:24px;font-style:italic;font-weight:600;line-height:1.45;white-space:pre-wrap}

/* ---------- SCRAPBOOK ---------- */
#bookWrap{max-width:380px;margin:0 auto}
#book{position:relative;width:100%;aspect-ratio:3/4;perspective:1600px}
.pg{position:absolute;inset:0;background:#fffdf9;color:var(--ink);border-radius:4px 12px 12px 4px;transform-origin:left center;transition:transform .9s cubic-bezier(.55,0,.25,1),opacity .3s;box-shadow:2px 2px 0 #efe4d6,4px 4px 0 #e4d6c4,6px 6px 0 #d8c8b3,0 18px 34px rgba(18,53,36,.25);overflow:hidden}
.pg::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(18,53,36,.18),rgba(18,53,36,0) 14%)}
.pg.turned{transform:rotateY(-125deg);opacity:0;pointer-events:none;transition:transform .9s cubic-bezier(.55,0,.25,1),opacity .35s .5s}
.pg.covr{background:linear-gradient(135deg,#1f5a3c,#123524 60%,#0b2217);cursor:pointer}
.cover{height:100%;padding:24px 22px 24px 30px}
.frame{width:100%;height:100%;border:2px solid #d9b36c;outline:1px solid #d9b36c;outline-offset:-9px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#ecd199;border-radius:4px}
.frame h3{font-size:38px;font-weight:700;line-height:1.1;padding:0 14px}
.frame p{font-style:italic;font-size:20px;margin-top:12px;opacity:.85}
.inner{height:100%;display:flex;flex-direction:column;padding:30px 24px 22px 34px;gap:12px}
.photo{flex:1;min-height:0;position:relative;background:#fff;padding:9px;box-shadow:0 4px 12px rgba(0,0,0,.2);transform:rotate(-1.6deg);margin-top:8px}
.pg:nth-child(odd) .photo{transform:rotate(1.4deg)}
.photo::before{content:"";position:absolute;top:-13px;left:50%;width:84px;height:24px;transform:translateX(-50%) rotate(2deg);background:rgba(217,179,108,.55)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.inner p{font-size:23px;font-style:italic;font-weight:500;text-align:center;line-height:1.3;max-height:5.3em;overflow:auto}
.inner audio{width:100%;height:34px}
.end{justify-content:center;align-items:center;text-align:center}
.end p{font-size:32px;max-height:none}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:30px}
.nav button{border:0;background:#d9b36c;color:#0f2a1d;font:600 19px 'Cormorant Garamond',serif;padding:10px 26px;border-radius:30px;cursor:pointer;box-shadow:0 4px 0 #8f6f2f}
.nav button:active{transform:translateY(3px);box-shadow:0 1px 0 #8f6f2f}
.nav button:disabled{opacity:.3}
#pg{font-style:italic;font-size:20px}
footer{text-align:center;margin-top:70px;font-size:26px;font-style:italic;color:var(--rose)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>

     ============================================================ -->
<script>
const CONFIG = {
  code: "2005",                 // the passcode (any digits). Hint is shown under the keypad.
  hint: "its one of the most memorable moments we had",
  candles: 5,                  // number of candles on the cake (1 to 9)
  cakeText: "Make a wish",
  cakeEnd: "May your wish come true",
  lockTitle: "Happy Birthday habibi",
  gardenTitle: "Happy Birthday Asoomti",         // appears in the middle of the flower garden
  gardenSub: "You wanted to plant a flower garden, I planted these for you",
  gardenButton: "Open your gift",
  heroTitle: "Happy Birthday to my sweet handsome husband",
  heroSubtitle: "I made this just for you and only you",
  heroPhotos: ["photos/13.jpeg", "photos/6.jpeg"],   // exactly two photos
  letter:

<script>

const media = m => m.video ? `<video controls playsinline preload="metadata" src="${m.video}"></video>` : img(m.img);
const img = src => `<img src="${src}" alt="" onerror="ph(event)">`;

/* counter + reasons */

const startT = new Date(C.togetherDate).getTime();
if (isNaN(startT)) { $("cntT").classList.add("hidden"); $("counter").classList.add("hidden"); $("cntSub").classList.add("hidden"); }
function tickCounter() {
  const d = Math.max(0, Math.floor((Date.now() - startT) / 1000));
  $("counter").innerHTML = [[Math.floor(d / 86400), "days"], [Math.floor(d % 86400 / 3600), "hours"], [Math.floor(d % 3600 / 60), "minutes"], [d % 60, "seconds"]].map(([v, l]) => `<div class="cbox"><b>${v}</b><span>${l}</span></div>`).join("");
}

const HEART = '<svg viewBox="0 0 32 29"><path fill="#d9b36c" d="M23.6 0c-3.4 0-6.3 2.7-7.6 5.6C14.7 2.7 11.8 0 8.4 0 3.8 0 0 3.8 0 8.4c0 9.4 9.5 11.9 16 19.7 6.1-7.8 16-10.3 16-19.7C32 3.8 28.2 0 23.6 0z"/></svg>';
$("reasons").innerHTML = C.reasons.map((r, i) => `<div class="rc"><div class="ri"><div class="rf">${HEART}<b>${i + 1}</b><span>tap me</span></div><div class="rb"><p>${r}</p></div></div></div>`).join("");
$("reasons").addEventListener("click", e => { const rc = e.target.closest(".rc"); if (rc) rc.classList.toggle("flip"); });

/* ===== sounds ===== */
const SFX = (() => {
  let ctx;
  const get = () => { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ctx && ctx.state === "suspended") ctx.resume(); return ctx; };
  function tone(f, t, d, type, v) {
    if (C.sounds === false) return; const a = get(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(), s = a.currentTime + t;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(v, s + .02); g.gain.exponentialRampToValueAtTime(.0001, s + d);
    o.connect(g); g.connect(a.destination); o.start(s); o.stop(s + d + .05);
  }
  return {
    right() { [659, 784, 1047].forEach((f, i) => tone(f, i * .09, .55, "sine", .22)); tone(2093, .25, .4, "sine", .06); },
    wrong() { tone(220, 0, .22, "triangle", .25); tone(165, .16, .34, "triangle", .25); },
    win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .12, .8, "sine", .2)); }
  };
})();

/* ===== fireworks ===== */
const FX = (() => {
  const cv = $("fx"), c = cv.getContext("2d"), DPR = Math.min(devicePixelRatio || 1, 2), P = [], Rk = [];
  let W, H, on = false, last = 0, pending = 0;
  const size = () => { W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; c.setTransform(DPR, 0, 0, DPR, 0, 0); };
  size(); addEventListener("resize", size);
  const cols = ["#ffd98a", "#ffffff", "#ff4d5e", "#7bd99a", "#f0d58f", "#ff9f43"];
  function burst(x, y) {
    const c1 = cols[Math.floor(Math.random() * cols.length)], c2 = cols[Math.floor(Math.random() * cols.length)];
    for (let i = 0; i < 80; i++) { const a = Math.random() * 6.283, v = 60 + Math.random() * 190; P.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, d: .9 + Math.random() * .9, col: i % 3 ? c1 : c2 }); }
  }
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    c.clearRect(0, 0, W, H); c.globalCompositeOperation = "lighter";
    for (let i = Rk.length - 1; i >= 0; i--) {
      const r = Rk[i]; r.t += dt; const k = Math.min(1, r.t / .7), y = H - (H - r.ty) * (1 - Math.pow(1 - k, 2));
      c.globalAlpha = 1; c.strokeStyle = "rgba(255,230,160,.8)"; c.lineWidth = 2; c.beginPath(); c.moveTo(r.x, y); c.lineTo(r.x, y + 26); c.stroke();
      if (k >= 1) { burst(r.x, r.ty); Rk.splice(i, 1); }
    }
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i]; p.life -= dt / p.d; if (p.life <= 0) { P.splice(i, 1); continue; }
      p.vy += 90 * dt; p.vx *= .985; p.vy *= .985; p.x += p.vx * dt; p.y += p.vy * dt;
      c.fillStyle = p.col; c.globalAlpha = Math.max(0, p.life); c.beginPath(); c.arc(p.x, p.y, 2.2, 0, 6.283); c.fill();
    }
    c.globalAlpha = 1; c.globalCompositeOperation = "source-over";
    if (P.length || Rk.length || pending > 0) requestAnimationFrame(loop); else { on = false; c.clearRect(0, 0, W, H); }
  }
  const start = () => { if (!on) { on = true; last = performance.now(); requestAnimationFrame(loop); } };
  return { show(n, gap) {
    start();
    for (let i = 0; i < n; i++) { pending++; setTimeout(() => { pending--; Rk.push({ x: W * (.15 + Math.random() * .7), ty: H * (.15 + Math.random() * .35), t: 0 }); start(); }, i * gap); }
  } };
})();

/* ===== open-when envelopes ===== */
$("envT").textContent = C.envTitle; if (!C.envTitle) $("envT").classList.add("hidden");
$("envs").innerHTML = C.envelopes.map((e, i) => `<div class="ev" data-i="${i}"><div class="body"><i class="l"></i><i class="r"></i><i class="b"></i></div>${e.label ? `<div class="lab">${e.label}</div>` : ""}<div class="flap"></div><div class="seal">${HEART}</div></div>`).join("");
$("envs").addEventListener("click", e => {
  const ev = e.target.closest(".ev"); if (!ev) return;
  const env = C.envelopes[+ev.dataset.i]; ev.classList.add("done");
  setTimeout(() => { $("emT").textContent = env.label ? "Open when " + env.label : ""; $("emT").style.display = env.label ? "" : "none"; $("emP").textContent = env.text; $("envModal").classList.remove("hidden"); }, 650);
});
$("emX").onclick = () => $("envModal").classList.add("hidden");
$("envModal").addEventListener("click", e => { if (e.target === $("envModal")) $("envModal").classList.add("hidden"); });

/* ===== quiz (unlimited tries, always ends with full marks) ===== */
$("quizT").textContent = C.quizTitle;
const Q = C.quiz, RIGHT = ["Yes! That's us.", "Exactly!", "You know me so well.", "Perfect."], WRONG = ["Not quite, try another one.", "So close. Think about us.", "Hmm, try again, my love.", "Almost! Take your time."];
const pick = a => a[Math.floor(Math.random() * a.length)];
let qi = 0, busy = false;
function renderQ() {
  const q = Q[qi]; busy = false;
  $("quiz").innerHTML = `<div class="qz"><div class="qdots">${Q.map((_, i) => `<i class="${i < qi ? "on" : i === qi ? "cur" : ""}"></i>`).join("")}</div><div class="qn">Question ${qi + 1} of ${Q.length}</div><div class="qq">${q.q}</div><div class="qo">${q.options.map((o, i) => `<button data-i="${i}">${o}</button>`).join("")}</div><div class="qm" id="qMsg">${qi === 0 ? C.quizIntro : ""}</div></div>`;
}
function finishQ() {
  $("quiz").innerHTML = `<div class="qz qres"><div class="qbig">${Q.length} / ${Q.length}</div><div class="qq">${C.quizDone}</div><button class="qa" id="qAgain">Play again</button></div>`;
  SFX.win(); FX.show(4, 400);
}
$("quiz").addEventListener("click", e => {
  if (e.target.id === "qAgain") { qi = 0; renderQ(); return; }
  const b = e.target.closest(".qo button"); if (!b || b.disabled || busy) return;
  if (+b.dataset.i === Q[qi].answer) {
    busy = true; b.classList.add("ok"); [...b.parentNode.children].forEach(x => x.disabled = true);
    $("qMsg").textContent = pick(RIGHT); SFX.right();
    setTimeout(() => { qi++; if (qi < Q.length) renderQ(); else finishQ(); }, 1300);
  } else { b.classList.add("no"); b.disabled = true; $("qMsg").textContent = pick(WRONG); SFX.wrong(); }
});
renderQ();

/* ===== gift ===== */

/* ===== bottom menu ===== */
const MENU = [["Letter", "letter"], ["Memories", "memT"], ["Reasons", "reasT"], ["Envelope", "envs"], ["Quiz", "quizT"], ["Scrapbook", "bookT"], ["Gift", "giftT"]];

const mio = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  document.querySelectorAll("#menu a").forEach(a => a.classList.toggle("on", a.dataset.t === e.target.id));
  const a = document.querySelector(`#menu a[data-t="${e.target.id}"]`), m = $("menu");
  if (a) m.scrollTo({ left: a.offsetLeft - m.clientWidth / 2 + a.clientWidth / 2, behavior: "smooth" });
}), { rootMargin: "-35% 0px -55% 0px" });
MENU.forEach(([, id]) => mio.observe($(id)));

/* keypad */

["1","2","3","4","5","6","7","8","9","","0","←"].forEach(k => {

});
function press(k) {
  if (k === "←") typed = typed.slice(0, -1); else if (k && typed.length < C.code.length) typed += k;
  [...$("dots").children].forEach((d, i) => d.classList.toggle("on", i < typed.length));
  if (typed.length === C.code.length) setTimeout(check, 200);
}
function check() {
  if (typed === C.code) return unlock();
  $("pad").classList.add("shake"); $("dots").classList.add("shake");
  setTimeout(() => { typed = ""; press(""); $("pad").classList.remove("shake"); $("dots").classList.remove("shake"); }, 450);

/* ===== sparkles on the lock screen ===== */
function lockFx() {
  const cv = $("lockFx"), c = cv.getContext("2d"), DPR = Math.min(devicePixelRatio || 1, 2), R = Math.random;
  let W, H;
  const size = () => { W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; c.setTransform(DPR, 0, 0, DPR, 0, 0); };
  size(); addEventListener("resize", size);
  const P = Array.from({ length: 80 }, () => ({ x: R(), y: R(), s: .6 + R() * 2, v: 6 + R() * 22, ph: R() * 6.28, tw: 1 + R() * 2.5 }));
  let last = performance.now();
  (function loop(now) {
    if ($("lock").classList.contains("hidden")) return;
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    c.clearRect(0, 0, W, H); c.globalCompositeOperation = "lighter";
    P.forEach(p => {
      p.y -= p.v * dt / H; if (p.y < -.05) { p.y = 1.05; p.x = R(); }
      const x = p.x * W + Math.sin(now / 1500 + p.ph) * 14, y = p.y * H, a = .25 + .75 * Math.abs(Math.sin(now / 1000 * p.tw + p.ph)), r = p.s * 2.2;
      const g = c.createRadialGradient(x, y, 0, x, y, r * 3); g.addColorStop(0, `rgba(255,224,140,${a})`); g.addColorStop(1, "rgba(255,200,90,0)");
      c.fillStyle = g; c.beginPath(); c.arc(x, y, r * 3, 0, 6.283); c.fill();
      if (p.s > 1.5) { c.strokeStyle = `rgba(255,240,190,${a})`; c.lineWidth = 1; c.beginPath(); c.moveTo(x - r * 3.2, y); c.lineTo(x + r * 3.2, y); c.moveTo(x, y - r * 3.2); c.lineTo(x, y + r * 3.2); c.stroke(); }
    });
    requestAnimationFrame(loop);
  })(last);

    const t = (now - t0) / 1000;
    c.clearRect(0, 0, W, H);
    const gl = c.createRadialGradient(W / 2, H * .62, 0, W / 2, H * .62, H * .55);
    gl.addColorStop(0, `rgba(255,170,90,${.24 * clamp(t / 4)})`); gl.addColorStop(1, "rgba(255,170,90,0)");
    c.fillStyle = gl; c.fillRect(0, 0, W, H);
    buds.forEach(b => plant(b, t, true));
    blades.forEach(b => !b.front && blade(b, t));
    flowers.forEach(f => plant(f, t, false));
    blades.forEach(b => b.front && blade(b, t));
    if (t > 2) {
      c.globalCompositeOperation = "lighter";
      flies.forEach(f => {
        const x = f.x * W + Math.sin(t * .35 + f.ph) * 40, y = f.y * H + Math.cos(t * .3 + f.ph) * 25, a = clamp(t - 2) * (.25 + .75 * Math.abs(Math.sin(t * 1.4 + f.ph)));
        const fg = c.createRadialGradient(x, y, 0, x, y, 7); fg.addColorStop(0, `rgba(255,226,140,${a})`); fg.addColorStop(1, "rgba(255,226,140,0)");
        c.fillStyle = fg; c.fillRect(x - 7, y - 7, 14, 14);
      });
      c.globalCompositeOperation = "source-over";
    }
    if (t > 6.5 && !titled) { titled = true; g.classList.add("titled"); }
    if (t > 9 && !ready) { ready = true; g.classList.add("ready"); }
    raf = requestAnimationFrame(loop);
  })(t0);

  $("gBtn").onclick = () => {
    g.style.opacity = 0; $("site").classList.remove("hidden"); scrollTo(0, 0); startVines(); $("menu").classList.remove("hidden");
    setTimeout(() => { cancelAnimationFrame(raf); g.remove(); startLetter(); }, 1500);
  };
}

/* handwritten letter */
function startLetter() {
  const el = $("letter"); let i = 0;
  (function t() { el.textContent = C.letter.slice(0, ++i); if (i < C.letter.length) setTimeout(t, 55); else el.classList.remove("cursor"); })();
}

/* scrapbook with page flips */
const pagesHTML = [
  `<div class="cover"><div class="frame"><h3>${C.scrapbookTitle}</h3><p>${C.scrapbookCover}</p></div></div>`,
  ...C.scrapbook.map(s => `<div class="inner"><div class="photo">${media(s)}</div><p>${s.text}</p>${s.audio ? `<audio controls preload="none" src="${s.audio}"></audio>` : ""}</div>`),
  `<div class="inner end"><p>${C.scrapbookEnd}</p></div>`
];
const total = pagesHTML.length; let pgi = 0;
const pages = pagesHTML.map((h, i) => { const d = document.createElement("div"); d.className = "pg" + (i ? "" : " covr"); d.style.zIndex = total - i; d.innerHTML = h; $("book").appendChild(d); return d; });
function sync() {
  $("prev").disabled = pgi === 0; $("next").disabled = pgi === total - 1;
  $("next").textContent = pgi === 0 ? "Open" : "Next";
  $("pg").textContent = pgi === 0 ? "" : `${Math.min(pgi, total - 2)} / ${total - 2}`;
}
function go(dir) {
  document.querySelectorAll("audio,video").forEach(a => a.pause());
  if (dir > 0 && pgi < total - 1) { pages[pgi].classList.add("turned"); pgi++; }
  else if (dir < 0 && pgi > 0) { pgi--; pages[pgi].classList.remove("turned"); }
  sync();
}
$("next").onclick = () => go(1); $("prev").onclick = () => go(-1);
pages[0].addEventListener("click", () => { if (pgi === 0) go(1); });
let sx = null;
$("book").addEventListener("touchstart", e => sx = e.touches[0].clientX, { passive: true });
$("book").addEventListener("touchend", e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1); sx = null; });
sync();
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add("in"); }), { threshold: .3 });
document.querySelectorAll(".mem").forEach(m => io.observe(m));
</script>
